<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#121212"/>
  <rect x="0" y="0" width="12" height="675" fill="#FF5A1F"/>
  <text x="60" y="80" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="900" fill="#F4F1EA">Secrets: not on the list.</text>
  <!-- door -->
  <rect x="860" y="170" width="220" height="400" fill="#1E1E1E" stroke="#A8A296" stroke-width="4"/>
  <text x="970" y="215" text-anchor="middle" font-family="monospace" font-size="28" fill="#F4F1EA">git push</text>
  <!-- bouncer -->
  <rect x="690" y="300" width="130" height="270" rx="10" fill="#3A3A3A"/>
  <circle cx="755" cy="260" r="42" fill="#3A3A3A"/>
  <rect x="660" y="370" width="190" height="80" fill="#F4F1EA"/>
  <text x="755" y="420" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#121212">.gitignore</text>
  <!-- robot -->
  <rect x="120" y="390" width="120" height="150" rx="14" fill="#FF5A1F"/>
  <rect x="140" y="320" width="80" height="70" rx="10" fill="#FF5A1F"/>
  <circle cx="165" cy="352" r="9" fill="#121212"/>
  <circle cx="197" cy="352" r="9" fill="#121212"/>
  <line x1="180" y1="320" x2="180" y2="295" stroke="#FF5A1F" stroke-width="5"/>
  <circle cx="180" cy="290" r="7" fill="#FF5A1F"/>
  <!-- file stack -->
  <rect x="260" y="250" width="200" height="50" fill="#F4F1EA"/>
  <text x="275" y="284" font-family="monospace" font-size="22" fill="#121212">app.js</text>
  <rect x="260" y="305" width="200" height="50" fill="#F4F1EA"/>
  <text x="275" y="339" font-family="monospace" font-size="22" fill="#121212">guard.py</text>
  <!-- stopped files -->
  <rect x="500" y="440" width="140" height="50" fill="#FF5A1F"/>
  <text x="515" y="474" font-family="monospace" font-size="22" font-weight="bold" fill="#121212">.env</text>
  <rect x="440" y="500" width="250" height="50" fill="#FF5A1F"/>
  <text x="452" y="534" font-family="monospace" font-size="20" font-weight="bold" fill="#121212">settings.local.json</text>
  <text x="470" y="610" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#A8A296">kit/.gitignore, shipped Day 28</text>
</svg>
