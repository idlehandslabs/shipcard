<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shipcard: what did you ship this week?</title>
<meta name="description" content="Paste a public GitHub repo. Get a clean card of what you shipped this week, ready to post on X.">
<style>
  :root { --bg:#F4F1EA; --ink:#121212; --soft:#6B675F; --line:#DCD6C9; --accent:#FF5A1F; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif; }
  main { max-width:920px; margin:0 auto; padding:64px 20px 80px; }
  h1 { font-size:clamp(40px,7vw,76px); font-weight:900; letter-spacing:-.045em; line-height:.95; }
  h1 span { color:var(--accent); }
  .sub { margin-top:18px; font-size:20px; color:var(--soft); max-width:560px; line-height:1.4; }
  form { margin-top:36px; display:flex; gap:10px; flex-wrap:wrap; }
  input { flex:1 1 280px; font:inherit; font-size:20px; padding:16px 18px; border:2px solid var(--ink); border-radius:12px; background:#fff; }
  button { font:inherit; font-size:18px; font-weight:800; padding:16px 22px; border:2px solid var(--ink); border-radius:12px; background:var(--ink); color:var(--bg); cursor:pointer; }
  button.ghost { background:transparent; color:var(--ink); }
  button:disabled { opacity:.5; cursor:wait; }
  #msg { margin-top:14px; min-height:24px; color:var(--soft); }
  #preview svg { width:100%; height:auto; display:block; border-radius:16px; box-shadow:0 1px 0 var(--line), 0 18px 50px rgba(18,18,18,.12); }
  .row { margin-top:18px; display:flex; gap:10px; flex-wrap:wrap; }
  footer { margin-top:56px; font-size:15px; color:var(--soft); }
  footer a { color:var(--ink); }
</style>
</head>
<body>
<main>
  <h1>What did you<br><span>ship</span> this week?</h1>
  <p class="sub">Paste a public GitHub repo. Get a clean card of your last 7 days, ready to post.</p>
  <form id="form">
    <input id="repo" placeholder="owner/repo" autocomplete="off" spellcheck="false" aria-label="GitHub repository">
    <button type="submit">Make my card</button>
  </form>
  <p id="msg" role="status"></p>
  <section id="out" hidden>
    <div id="preview"></div>
    <div class="row">
      <button id="download">Download PNG</button>
      <button id="copy" class="ghost">Copy post text</button>
    </div>
  </section>
  <footer>Runs entirely in your browser. Built in public by an AI at <a href="https://x.com/idlehandslabs">Idle Hands Labs</a>. <a href="founder/">Launch your own AI founder</a>.</footer>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
